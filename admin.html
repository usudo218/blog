<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .editor-toolbar {
            display: flex;
            gap: 6px;
            background: #f8fafc;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 12px 12px 0 0;
            border-bottom: none;
        }
        .btn-tool {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            color: #1e293b;
        }
        .btn-tool:hover {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }
        #konten {
            border-radius: 0 0 12px 12px !important;
            line-height: 1.6;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-black text-white shadow-lg mb-8">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black uppercase tracking-widest">Admin Panel</h1>
            <a href="index.html" class="text-xs font-bold border border-white px-4 py-2 rounded-full hover:bg-white hover:text-black transition">Lihat Blog</a>
        </div>
    </nav>

    <main class="container mx-auto px-4 max-w-3xl">
        <div class="bg-white p-6 md:p-10 rounded-[2rem] shadow-xl border border-slate-100">
            <h2 class="text-2xl font-black mb-8 border-b-4 border-black inline-block uppercase">Tambah Catatan Baru</h2>
            
            <form id="blogForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-black uppercase tracking-widest text-slate-700 mb-2">Judul Artikel</label>
                    <input type="text" id="judul" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-black uppercase tracking-widest text-slate-700 mb-2">Tanggal</label>
                        <input type="date" id="tanggal" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-black uppercase tracking-widest text-slate-700 mb-2">Kategori</label>
                        <select id="kategori" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                            <option value="Rasan-rasan">Rasan-rasan</option>
                            <option value="Fiksiana">Fiksiana</option>
                            <option value="Asal nulis">Asal Nulis</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-black uppercase tracking-widest text-slate-700 mb-2">URL Gambar (Opsional)</label>
                    <input type="url" id="gambar" placeholder="https://..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-black uppercase tracking-widest text-slate-700 mb-2">Isi Catatan</label>
                    <div class="editor-toolbar">
                        <button type="button" class="btn-tool" title="Tebal" onclick="formatText('b')">B</button>
                        <button type="button" class="btn-tool" title="Miring" onclick="formatText('i')">I</button>
                        <button type="button" class="btn-tool" title="Garis Bawah" onclick="formatText('u')">U</button>
                        <button type="button" class="btn-tool" title="Kutipan" onclick="formatText('blockquote')">Quote</button>
                    </div>
                    <textarea id="konten" rows="12" required class="w-full p-6 bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-black outline-none transition" placeholder="Tuliskan isi hati di sini..."></textarea>
                    <p class="text-[10px] text-slate-400 mt-2 font-medium uppercase tracking-wider italic">*Tip: Sorot teks lalu klik tombol di atas untuk memberi format.</p>
                </div>

                <div>
                    <label class="block text-sm font-black uppercase tracking-widest text-slate-700 mb-2">Tags (Pisahkan dengan koma)</label>
                    <input type="text" id="tags" placeholder="catatan, refleksi, hidup" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-black uppercase tracking-widest text-slate-700 mb-2">ID Video YouTube (Jika ada)</label>
                    <input type="text" id="youtube" placeholder="Contoh: dQw4w9WgXcQ" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-black text-white p-5 rounded-xl font-black uppercase tracking-[0.2em] hover:bg-slate-800 transition shadow-xl active:scale-95">
                    Posting ke Blog
                </button>
            </form>
        </div>
        
        <p class="text-center mt-12 mb-8 text-slate-400 text-[10px] font-bold tracking-widest uppercase">
            &copy; 2026 Penulis Pemula - Dashboard Admin
        </p>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec"; // <--- GANTI DENGAN URL BAPAK

        // FUNGSI TOOLBAR EDITOR
        function formatText(tag) {
            const area = document.getElementById('konten');
            const start = area.selectionStart;
            const end = area.selectionEnd;
            const selectedText = area.value.substring(start, end);
            
            // Format yang akan disisipkan
            const replacement = `<${tag}>${selectedText || 'teks'}</${tag}>`;
            
            // Masukkan ke posisi kursor
            area.value = area.value.substring(0, start) + replacement + area.value.substring(end);
            
            area.focus();
            // Kembalikan posisi blok kursor
            area.setSelectionRange(start + tag.length + 2, start + tag.length + 2 + (selectedText.length || 4));
        }

        // PROSES KIRIM DATA
        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "MENGIRIM...";

            const payload = {
                judul: document.getElementById('judul').value,
                tanggal: document.getElementById('tanggal').value,
                konten: document.getElementById('konten').value,
                gambar: document.getElementById('gambar').value,
                kategori: document.getElementById('kategori').value,
                tags: document.getElementById('tags').value,
                youtube: document.getElementById('youtube').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.text();
                alert("Catatan Berhasil Disimpan di Spreadsheet!");
                document.getElementById('blogForm').reset();
            } catch (err) {
                alert("Gagal mengirim: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "POSTING KE BLOG";
            }
        });
    </script>
</body>
</html>
