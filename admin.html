<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin - Update Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Tambah Artikel Baru</h2>
        
        <input type="text" id="title" class="w-full border p-3 rounded mb-4" placeholder="Judul Artikel">
        <textarea id="content" class="w-full border p-3 rounded mb-4 h-48" placeholder="Paste konten dari Word..."></textarea>
        
        <button onclick="generateJSON()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">
            Generate Kode JSON
        </button>

        <div id="output-area" class="hidden mt-8">
            <p class="text-sm text-red-600 mb-2 font-semibold">Copy semua kode di bawah ini dan paste ke file data.json di GitHub:</p>
            <textarea id="json-result" class="w-full bg-gray-900 text-green-400 p-4 rounded font-mono text-xs h-64" readonly></textarea>
        </div>
    </div>

    <script>
        async function generateJSON() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const date = new Date().toLocaleDateString('id-ID');

            // 1. Ambil data lama dari file data.json yang ada di server/github
            try {
                const response = await fetch('data.json');
                const oldPosts = await response.json();
                
                // 2. Tambah data baru ke dalam list
                const newPost = { title, date, content };
                oldPosts.push(newPost);

                // 3. Tampilkan hasil JSON yang sudah digabung
                document.getElementById('json-result').value = JSON.stringify(oldPosts, null, 2);
                document.getElementById('output-area').classList.remove('hidden');
                
                alert("Berhasil! Silakan copy kode JSON di bawah.");
            } catch (e) {
                alert("Gagal mengambil data.json. Pastikan file data.json sudah diupload ke GitHub.");
            }
        }
    </script>
</body>
</html>
