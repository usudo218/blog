<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .editor-toolbar { display: flex; gap: 6px; background: #f8fafc; padding: 10px; border: 1px solid #cbd5e1; border-radius: 12px 12px 0 0; border-bottom: none; }
        .btn-tool { background: white; border: 1px solid #cbd5e1; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.2s; color: #1e293b; }
        .btn-tool:hover { background: #1a1a1a; color: white; border-color: #1a1a1a; }
        #konten { border-radius: 0 0 12px 12px !important; line-height: 1.6; }
        #admin-panel { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
        <div class="fade-in bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl border border-slate-100 w-full max-w-md text-center">
            <div class="mb-8">
                <div class="w-20 h-20 bg-black rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <span class="text-white text-3xl font-black">AT</span>
                </div>
                <h2 class="text-2xl font-black uppercase tracking-tight">Pintu Masuk</h2>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1 text-black">Khusus Penulis Pemula</p>
            </div>
            <input type="password" id="login_pass" placeholder="Password Rahasia" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-black outline-none transition text-center mb-4 text-lg">
            <button onclick="prosesLogin()" class="w-full bg-black text-white p-4 rounded-2xl font-black uppercase tracking-widest hover:bg-slate-800 transition active:scale-95 shadow-xl mb-6">Buka Kunci</button>
            
            <a href="index.html" class="inline-block text-black text-[10px] font-black uppercase tracking-[0.3em] hover:underline decoration-2 underline-offset-4">
                ← Kembali ke Blog
            </a>
        </div>
    </div>

    <div id="admin-panel">
        <nav class="bg-black text-white shadow-lg sticky top-0 z-50">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-lg font-black uppercase tracking-widest text-white">Admin Dashboard</h1>
                <button onclick="logout()" class="text-[10px] font-black border border-white px-4 py-1.5 rounded-full hover:bg-white hover:text-black transition uppercase">Keluar</button>
            </div>
        </nav>

        <main class="container mx-auto px-4 py-10 max-w-4xl grid grid-cols-1 gap-8">
            
            <div class="fade-in bg-white p-6 md:p-10 rounded-[2.5rem] shadow-xl border border-slate-100">
                <form id="blogForm" class="space-y-6">
                    <input type="hidden" id="edit_id" value="">

                    <div class="mb-8 flex justify-between items-end">
                        <div>
                            <h2 id="form-title" class="text-2xl font-black border-b-4 border-black inline-block uppercase tracking-tight">Tambah Catatan</h2>
                            <p class="text-black text-[10px] font-bold uppercase tracking-widest mt-1">Ruang Merawat Ingatan Agus Tjakra</p>
                        </div>
                        <button type="button" onclick="resetForm()" class="text-[10px] font-black text-red-600 uppercase underline decoration-2 underline-offset-4">Batal / Reset</button>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-black mb-2">Judul Artikel</label>
                        <input type="text" id="judul" required placeholder="Apa yang ingin diabadikan?" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition font-bold">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-black mb-2">Tanggal</label>
                            <input type="date" id="tanggal" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-black mb-2">Kategori</label>
                            <select id="kategori" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition font-bold">
                                <option value="Rasan-rasan">Rasan-rasan</option>
                                <option value="Fiksiana">Fiksiana</option>
                                <option value="Asal nulis">Asal Nulis</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-black mb-2">URL Gambar</label>
                        <input type="url" id="gambar" placeholder="https://..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-black outline-none transition">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-black mb-2">Isi Konten</label>
                        <div class="editor-toolbar text-black">
                            <button type="button" class="btn-tool" onclick="formatText('b')">B</button>
                            <button type="button" class="btn-tool" onclick="formatText('i')">I</button>
                            <button type="button" class="btn-tool" onclick="formatText('u')">U</button>
                            <button type="button" class="btn-tool" onclick="formatText('blockquote')">Quote</button>
                        </div>
                        <textarea id="konten" rows="12" required class="w-full p-6 bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-black outline-none transition"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" id="tags" placeholder="Tags (koma)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl">
                        <input type="text" id="youtube" placeholder="ID Youtube" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-black text-white p-5 rounded-2xl font-black uppercase tracking-[0.3em] hover:bg-slate-800 transition shadow-2xl active:scale-95">Simpan Catatan</button>
                </form>
            </div>

            <div class="fade-in bg-white p-8 rounded-[2.5rem] shadow-lg border border-slate-100 overflow-hidden">
                <h3 class="text-[10px] font-black uppercase tracking-[0.2em] mb-6 text-black border-b pb-2">Daftar Postingan (Pilih untuk Edit)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="text-[10px] uppercase tracking-widest text-slate-400 border-b">
                                <th class="py-3 px-2">Judul</th>
                                <th class="py-3 px-2 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="list-postingan">
                            <tr><td colspan="2" class="p-10 text-center italic text-slate-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec"; 
        let allData = [];

        window.onload = function() {
            if (sessionStorage.getItem("adminAuth") === "true") { bukaPanelAdmin(); }
        };

        function prosesLogin() {
            const pass = document.getElementById('login_pass').value;
            if (pass === "") return alert("Password kosong!");
            sessionStorage.setItem("adminPass", pass);
            bukaPanelAdmin();
        }

        async function bukaPanelAdmin() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            sessionStorage.setItem("adminAuth", "true");
            fetchData();
        }

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                allData = await res.json();
                renderList();
            } catch (e) { console.error("Gagal ambil data"); }
        }

        function renderList() {
            const container = document.getElementById('list-postingan');
            container.innerHTML = '';
            // Ambil data asli (tanpa reverse untuk melacak index baris yang benar)
            // Header ada di baris 1, jadi data pertama ada di baris 2
            allData.forEach((post, index) => {
                const actualRowNumber = index + 2; 
                container.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 transition">
                        <td class="py-4 px-2 font-bold text-slate-800 text-xs">${post.judul}</td>
                        <td class="py-4 px-2 text-right">
                            <button onclick="pilihEdit('${post.judul}', ${actualRowNumber})" class="bg-black text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-blue-700 transition">Edit</button>
                        </td>
                    </tr>
                `;
            });
        }

        function pilihEdit(judul, rowNumber) {
            // Cari data berdasarkan judul dari array allData
            const post = allData.find(p => p.judul === judul);
            if (!post) return;
            
            document.getElementById('form-title').innerText = "Edit Catatan (Baris #" + rowNumber + ")";
            document.getElementById('edit_id').value = rowNumber; // Simpan ID baris di input hidden
            
            document.getElementById('judul').value = post.judul;
            document.getElementById('tanggal').value = formatTanggalInput(post.tanggal);
            document.getElementById('kategori').value = post.kategori || "Rasan-rasan";
            document.getElementById('gambar').value = post.gambar || '';
            document.getElementById('konten').value = post.konten || '';
            document.getElementById('tags').value = post.tags || '';
            document.getElementById('youtube').value = post.youtube || '';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatTanggalInput(tglStr) {
            if(!tglStr) return '';
            const d = new Date(tglStr);
            if(isNaN(d.getTime())) return '';
            return d.toISOString().split('T')[0];
        }

        function resetForm() {
            document.getElementById('blogForm').reset();
            document.getElementById('edit_id').value = ""; 
            document.getElementById('form-title').innerText = "Tambah Catatan";
        }

        function logout() { sessionStorage.clear(); location.reload(); }

        function formatText(tag) {
            const area = document.getElementById('konten');
            const start = area.selectionStart;
            const end = area.selectionEnd;
            const replacement = `<${tag}>${area.value.substring(start, end) || '...'}</${tag}>`;
            area.value = area.value.substring(0, start) + replacement + area.value.substring(end);
            area.focus();
        }

        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "MENGIRIM...";

            const payload = {
                password: sessionStorage.getItem("adminPass"),
                id: document.getElementById('edit_id').value, // Mengirim ID Baris
                judul: document.getElementById('judul').value,
                tanggal: document.getElementById('tanggal').value,
                konten: document.getElementById('konten').value,
                gambar: document.getElementById('gambar').value,
                kategori: document.getElementById('kategori').value,
                tags: document.getElementById('tags').value,
                youtube: document.getElementById('youtube').value
            };

            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.text();
                
                if (result === "PASSWORD_SALAH") {
                    alert("Akses Ditolak! Password Salah.");
                    logout();
                } else {
                    alert("✅ Berhasil: " + result);
                    resetForm();
                    fetchData(); // Muat ulang tabel daftar
                }
            } catch (err) { alert("Error koneksi."); }
            finally { btn.disabled = false; btn.innerText = "SIMPAN CATATAN"; }
        });
    </script>
</body>
</html>
