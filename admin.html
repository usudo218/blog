<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Penulis Pemula</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/usudo218/blog/main/pp.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; color: #000; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .editor-toolbar { display: flex; gap: 6px; background: #f8fafc; padding: 10px; border: 1px solid #000; border-radius: 12px 12px 0 0; border-bottom: none; overflow-x: auto; }
        .btn-tool { background: white; border: 1px solid #000; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .btn-tool:hover { background: #000; color: #fff; }
        textarea { border-radius: 0 0 12px 12px !important; line-height: 1.6; }
        .table-container { overflow-x: auto; background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; margin-top: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; text-align: left; padding: 1rem; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 1rem; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-black max-w-sm w-full text-center fade-in">
            <img src="https://raw.githubusercontent.com/usudo218/blog/main/pp.png" class="w-20 h-20 mx-auto mb-6">
            <h2 class="text-2xl font-black mb-6 tracking-tight uppercase">Akses Penulis</h2>
            <input type="password" id="passInput" placeholder="Masukkan Password" class="w-full p-4 border-2 border-black rounded-2xl mb-4 text-center font-bold focus:outline-none focus:ring-4 focus:ring-slate-200">
            <button onclick="login()" class="w-full bg-black text-white p-4 rounded-2xl font-black hover:scale-105 transition shadow-lg">MASUK PANEL</button>
            <a href="index.html" class="inline-block mt-6 text-xs font-bold uppercase tracking-widest hover:underline text-slate-400">← Kembali ke Blog</a>
        </div>
    </div>

    <div id="admin-panel" class="hidden max-w-5xl mx-auto p-6 md:py-12 fade-in">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-black tracking-tighter uppercase">Dashboard Penulis</h1>
                <p class="text-sm font-bold text-slate-500 italic">"Merawat ingatan melalui aksara"</p>
            </div>
            <div class="flex gap-3">
                <a href="index.html" class="bg-white border-2 border-black px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-100 transition">Lihat Blog</a>
                <button onclick="logout()" class="bg-red-500 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-red-600 transition shadow-md">Keluar</button>
            </div>
        </div>

        <form id="blogForm" class="space-y-6 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
            <h2 class="text-sm font-black uppercase tracking-widest border-b pb-2 mb-4">Tulis Catatan Baru</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest mb-2">Judul Catatan</label>
                    <input type="text" id="judul" required class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-black outline-none transition font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest mb-2">Tanggal</label>
                    <input type="text" id="tanggal" required class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-black outline-none transition font-bold">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest mb-2">Konten (HTML Support)</label>
                <div class="editor-toolbar">
                    <button type="button" class="btn-tool" onclick="wrapText('b')">BOLD</button>
                    <button type="button" class="btn-tool" onclick="wrapText('i')">ITALIC</button>
                    <button type="button" class="btn-tool" onclick="insertTag('blockquote')">KUTIPAN</button>
                    <button type="button" class="btn-tool" onclick="insertTag('p')">PARAGRAF</button>
                    <button type="button" class="btn-tool" onclick="insertTag('br')">BARIS BARU</button>
                </div>
                <textarea id="konten" rows="8" required class="w-full p-6 border-2 border-black rounded-b-2xl focus:ring-4 focus:ring-slate-50 outline-none transition font-medium text-lg"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest mb-2">Link Gambar</label>
                    <input type="text" id="gambar" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-black outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest mb-2">Kategori</label>
                    <select id="kategori" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-black outline-none transition font-bold">
                        <option value="Asal Nulis">Asal Nulis</option>
                        <option value="Rasan-rasan">Rasan-rasan</option>
                        <option value="Fiksiana">Fiksiana</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest mb-2">Tags (Pisahkan dengan koma)</label>
                    <input type="text" id="tags" placeholder="contoh: opini, harian, cerita" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-black outline-none transition text-sm font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest mb-2">ID Youtube / Drive</label>
                    <input type="text" id="youtube" class="w-full p-4 border-2 border-slate-100 rounded-2xl focus:border-black outline-none transition text-sm" placeholder="ID saja">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-black text-white py-5 rounded-2xl font-black text-sm uppercase tracking-[0.3em] hover:scale-[1.02] transition shadow-2xl">Terbitkan Catatan</button>
        </form>

        <div class="mt-12">
            <h2 class="text-sm font-black uppercase tracking-widest border-b pb-2 mb-4">Kelola Catatan (Edit di Spreadsheet)</h2>
            <div class="table-container shadow-sm">
                <table>
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Tanggal</th>
                            <th>Kategori</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="4" class="text-center py-10 text-slate-400 animate-pulse uppercase font-bold tracking-widest text-xs">Memuat daftar catatan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwswRmG9bu9WWPPewrgNE2aHzNh9KMK0OJyCdI8rn8utEsz-0adBZXzni3Zldm42Dl2Bg/exec";
        const SPREADSHEET_ID = "1CraAGn4_MdzuORTnBJaTSmE7lp-uB1eeHycGkba8vR4"; 

        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass.length > 0) {
                sessionStorage.setItem("adminAuth", "true");
                sessionStorage.setItem("adminPass", pass);
                bukaPanelAdmin();
            } else {
                alert("Masukkan password terlebih dahulu!");
            }
        }

        async function bukaPanelAdmin() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            
            if(!document.getElementById('tanggal').value) {
                const now = new Date();
                const tgl = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                document.getElementById('tanggal').value = tgl;
            }
            
            muatDaftarArtikel();
        }

        async function muatDaftarArtikel() {
            const tbody = document.getElementById('table-body');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                tbody.innerHTML = '';
                [...data].reverse().forEach((item, index) => {
                    const barisSpreadsheet = data.length - index + 1;
                    const editUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit#gid=0&range=A${barisSpreadsheet}`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="font-bold text-slate-900">${item.judul}</td>
                            <td class="text-slate-500">${item.tanggal}</td>
                            <td><span class="text-[9px] bg-slate-100 px-2 py-1 rounded-full font-black uppercase tracking-widest">${item.kategori || 'UMUM'}</span></td>
                            <td class="text-center">
                                <a href="${editUrl}" target="_blank" class="inline-block bg-black text-white text-[10px] font-black px-4 py-2 rounded-full hover:scale-105 transition uppercase tracking-widest">Edit Baris</a>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-red-500 font-bold">Gagal memuat daftar.</td></tr>';
            }
        }

        function wrapText(tag) {
            const area = document.getElementById('konten');
            const start = area.selectionStart;
            const end = area.selectionEnd;
            const text = area.value;
            area.value = text.substring(0, start) + `<${tag}>` + text.substring(start, end) + `</${tag}>` + text.substring(end);
        }

        function insertTag(tag) {
            const area = document.getElementById('konten');
            const start = area.selectionStart;
            area.value = area.value.substring(0, start) + (tag === 'br' ? '<br>\n' : `<${tag}>\n\n</${tag}>\n`) + area.value.substring(start);
        }

        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "MENGIRIM...";
            btn.disabled = true;
            
            const payload = {
                password: sessionStorage.getItem("adminPass"),
                judul: document.getElementById('judul').value,
                tanggal: document.getElementById('tanggal').value,
                konten: document.getElementById('konten').value,
                gambar: document.getElementById('gambar').value,
                kategori: document.getElementById('kategori').value,
                tags: document.getElementById('tags').value,
                youtube: document.getElementById('youtube').value
            };

            try {
                const response = await fetch(API_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', // Menghindari masalah CORS pada Google Apps Script
                    body: JSON.stringify(payload) 
                });
                
                // Karena no-cors, kita tidak bisa membaca response text secara langsung
                // Namun data biasanya sudah masuk.
                localStorage.removeItem('blog_data_cache');
                localStorage.removeItem('blog_data_time');
                alert("Permintaan Terkirim! Silakan cek blog Anda dalam beberapa saat.");
                location.reload(); 
                
            } catch (err) {
                alert("Koneksi Error!");
                btn.innerText = "Terbitkan Catatan";
                btn.disabled = false;
            }
        });

        function logout() { 
            sessionStorage.clear(); 
            location.reload(); 
        }

        if (sessionStorage.getItem("adminAuth") === "true") bukaPanelAdmin();
    </script>
</body>
</html>
