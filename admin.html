<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 md:p-12">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-3xl font-bold mb-6 text-blue-600">Tambah Artikel Baru</h2>
        
        <div class="space-y-4">
            <input type="text" id="judul" placeholder="Judul Artikel" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            
            <input type="text" id="gambar" placeholder="Link Gambar (Google Drive/Lainnya)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            
            <textarea id="konten" rows="10" placeholder="Paste konten dari Word di sini..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
            
            <button onclick="kirimKeSheets()" id="btnSimpan" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                Terbitkan ke Blog
            </button>
            <p id="pesan" class="text-center font-semibold mt-4"></p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxmTs1IwzKO5yirj2zN3IIGSMl1UzuBaNnsSHaJ__yhqzlMPAgCuslCL92G1Zuw5AjBrw/exec"; // Masukkan URL Deploy baru di sini

        async function kirimKeSheets() {
            const btn = document.getElementById('btnSimpan');
            const pesan = document.getElementById('pesan');
            
            const data = {
                judul: document.getElementById('judul').value,
                gambar: document.getElementById('gambar').value,
                konten: document.getElementById('konten').value,
                tanggal: new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})
            };

            if(!data.judul || !data.konten) return alert("Judul dan Konten wajib diisi!");

            btn.disabled = true;
            btn.innerText = "Sedang Mengirim...";
            pesan.innerText = "";

            try {
                // Mengirim data ke Google Sheets via Apps Script
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                pesan.className = "text-center font-semibold mt-4 text-green-600";
                pesan.innerText = "Berhasil! Artikel sudah masuk ke Spreadsheet dan Blog.";
                // Kosongkan form
                document.getElementById('judul').value = "";
                document.getElementById('gambar').value = "";
                document.getElementById('konten').value = "";
            } catch (error) {
                pesan.className = "text-center font-semibold mt-4 text-red-600";
                pesan.innerText = "Gagal mengirim. Cek koneksi atau URL API.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Terbitkan ke Blog";
            }
        }
    </script>
</body>
</html>
