<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-8">
    <div id="login-box" class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-xl mb-4 font-bold">Login Admin</h2>
        <input type="password" id="pass" class="border w-full p-2 mb-4" placeholder="Password">
        <button onclick="checkLogin()" class="bg-blue-500 text-white px-4 py-2 rounded">Masuk</button>
    </div>

    <div id="admin-content" class="hidden max-w-2xl mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-xl mb-4 font-bold">Buat Postingan Baru</h2>
        <input type="text" id="title" class="border w-full p-2 mb-4" placeholder="Judul Artikel">
        <textarea id="content" class="border w-full p-2 mb-4 h-64" placeholder="Paste konten dari Word di sini..."></textarea>
        <button onclick="savePost()" class="bg-green-500 text-white px-4 py-2 rounded">Simpan & Download JSON</button>
        <p class="mt-4 text-sm text-gray-500 italic">*GitHub Pages statis, setelah simpan, Anda harus mengupdate file data.json di repo Anda.</p>
    </div>

    <script>
        function checkLogin() {
            const pass = document.getElementById('pass').value;
            if(pass === "admin123") { // Ganti password Anda di sini
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
            } else { alert("Password Salah!"); }
        }

        function savePost() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const post = { title, content, date: new Date().toLocaleDateString() };
            
            // Logika untuk mendownload sebagai file JSON (cara termudah update statis)
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(post));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "post_" + Date.now() + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</body>
</html>
