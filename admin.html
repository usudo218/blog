<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #admin-panel { display: none; }
    </style>
</head>
<body>
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-10 rounded-[2rem] shadow-xl text-center w-full max-w-md">
            <h2 class="text-2xl font-black mb-6">LOGIN ADMIN</h2>
            <input type="password" id="login_pass" placeholder="Password" class="w-full p-4 border rounded-xl mb-4 text-center">
            <button onclick="prosesLogin()" class="w-full bg-black text-white p-4 rounded-xl font-black">BUKA PANEL</button>
        </div>
    </div>

    <div id="admin-panel">
        <main class="container mx-auto px-4 py-10 max-w-2xl">
            <div class="bg-white p-8 rounded-[2rem] shadow-lg border">
                <form id="blogForm" class="space-y-4">
                    <input type="text" id="judul" required placeholder="Judul" class="w-full p-4 border rounded-xl">
                    <input type="date" id="tanggal" required class="w-full p-4 border rounded-xl">
                    
                    <select id="kategori" class="w-full p-4 border rounded-xl">
                        <option value="Asal Nulis">Asal Nulis</option>
                        <option value="Rasan-rasan">Rasan-rasan</option>
                        <option value="Fiksiana">Fiksiana</option>
                    </select>

                    <input type="text" id="gambar" placeholder="Link Gambar" class="w-full p-4 border rounded-xl">
                    <input type="text" id="tags" placeholder="Tags (koma)" class="w-full p-4 border rounded-xl">
                    <input type="text" id="youtube" placeholder="ID Youtube/Drive" class="w-full p-4 border rounded-xl">
                    
                    <textarea id="konten" rows="8" required placeholder="Isi Tulisan" class="w-full p-4 border rounded-xl"></textarea>
                    
                    <button type="submit" id="submitBtn" class="w-full bg-black text-white p-5 rounded-xl font-black uppercase">KIRIM KE BLOG</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        // MASUKKAN URL /exec HASIL NEW DEPLOYMENT BAPAK DI SINI
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec"; 

        function prosesLogin() {
            sessionStorage.setItem("adminPass", document.getElementById('login_pass').value);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        }

        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "MENGIRIM...";
            
            const payload = {
                password: sessionStorage.getItem("adminPass"),
                judul: document.getElementById('judul').value,
                tanggal: document.getElementById('tanggal').value,
                konten: document.getElementById('konten').value,
                gambar: document.getElementById('gambar').value,
                kategori: document.getElementById('kategori').value,
                tags: document.getElementById('tags').value,
                youtube: document.getElementById('youtube').value
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const txt = await res.text();
                alert("Status: " + txt);
                location.reload();
            } catch (err) {
                alert("Error!");
                btn.innerText = "KIRIM KE BLOG";
            }
        });
    </script>
</body>
</html>
