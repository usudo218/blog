<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Penulis Pemula</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/usudo218/blog/main/pp.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .editor-toolbar { display: flex; gap: 6px; background: #f8fafc; padding: 10px; border: 1px solid #000; border-radius: 12px 12px 0 0; border-bottom: none; overflow-x: auto; }
        .btn-tool { background: white; border: 1px solid #000; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 800; cursor: pointer; }
        .btn-tool:hover { background: #000; color: white; }
        #konten { border-radius: 0 0 12px 12px !important; border: 1px solid #000; }
        #admin-panel { display: none; }
    </style>
</head>
<body class="bg-slate-50">

    <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-xl border border-slate-100 w-full max-w-md text-center">
            <h2 class="text-2xl font-black uppercase mb-6">Admin Login</h2>
            <input type="password" id="login_pass" placeholder="Password" class="w-full p-4 border border-black rounded-2xl text-center mb-4 outline-none">
            <button onclick="prosesLogin()" class="w-full bg-black text-white p-4 rounded-2xl font-black uppercase shadow-lg hover:scale-105 transition">Masuk</button>
        </div>
    </div>

    <div id="admin-panel">
        <nav class="bg-black text-white p-4 sticky top-0 z-50">
            <div class="container mx-auto flex justify-between items-center text-xs font-black uppercase">
                <h1>Admin Dashboard</h1>
                <button onclick="logout()" class="border border-white px-4 py-1 rounded-full">Keluar</button>
            </div>
        </nav>

        <main class="container mx-auto px-4 py-10 max-w-3xl">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 mb-10">
                <form id="blogForm" class="space-y-4">
                    <h2 class="text-xl font-black uppercase mb-4">Posting Baru</h2>
                    
                    <input type="text" id="judul" required placeholder="Judul Artikel" class="w-full p-4 border border-black rounded-xl font-bold">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <input type="date" id="tanggal" required class="p-4 border border-black rounded-xl">
                        <select id="kategori" class="p-4 border border-black rounded-xl font-bold">
                            <option value="Asal Nulis">Asal Nulis</option>
                            <option value="Rasan-rasan">Rasan-rasan</option>
                            <option value="Fiksiana">Fiksiana</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="gambar" placeholder="URL Gambar" class="p-4 border border-black rounded-xl text-xs">
                        <input type="text" id="youtube" placeholder="ID Video YouTube" class="p-4 border border-black rounded-xl text-xs">
                    </div>

                    <input type="text" id="tags" placeholder="Tags (pisah dengan koma)" class="w-full p-4 border border-black rounded-xl text-xs">

                    <div>
                        <div class="editor-toolbar">
                            <button type="button" class="btn-tool" onclick="formatText('b')">B</button>
                            <button type="button" class="btn-tool" onclick="formatText('i')">I</button>
                            <button type="button" class="btn-tool" onclick="formatText('p')">P</button>
                            <button type="button" class="btn-tool" onclick="formatText('br')">BR</button>
                        </div>
                        <textarea id="konten" rows="10" required placeholder="Isi rasan-rasan..." class="w-full p-6 outline-none border border-black rounded-b-xl"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-black text-white p-5 rounded-2xl font-black uppercase shadow-xl hover:bg-slate-800 transition">Kirim ke Blog</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const API_URL = "ISI_DENGAN_URL_DEPLOYMENT_ANDA"; 

        function formatText(tag) {
            const area = document.getElementById('konten');
            const start = area.selectionStart;
            const end = area.selectionEnd;
            const text = area.value.substring(start, end);
            let result = tag === 'br' ? text + "<br/>" : `<${tag}>${text}</${tag}>`;
            area.value = area.value.substring(0, start) + result + area.value.substring(end);
            area.focus();
        }

        function prosesLogin() {
            const pass = document.getElementById('login_pass').value;
            if(pass === "123") { // Ganti password sesuai keinginan
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                sessionStorage.setItem("adminAuth", "true");
            } else {
                alert("Password Salah!");
            }
        }

        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "MENGIRIM...";
            btn.disabled = true;
            
            const payload = {
                judul: document.getElementById('judul').value,
                tanggal: document.getElementById('tanggal').value,
                konten: document.getElementById('konten').value,
                gambar: document.getElementById('gambar').value,
                kategori: document.getElementById('kategori').value,
                tags: document.getElementById('tags').value,
                youtube: document.getElementById('youtube').value
            };

            try {
                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const txt = await response.text();
                
                // BERSIHKAN CACHE SETELAH POSTING
                localStorage.removeItem('blog_data_cache');
                localStorage.removeItem('blog_data_time');
                
                alert("Hasil: " + txt);
                window.location.href = "index.html"; 
            } catch (err) {
                alert("Koneksi Error!");
                btn.innerText = "Kirim ke Blog";
                btn.disabled = false;
            }
        });

        function logout() { sessionStorage.clear(); location.reload(); }
        if (sessionStorage.getItem("adminAuth") === "true") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        }
    </script>
</body>
</html>
