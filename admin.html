<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; color: #000; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #admin-panel { display: none; }
        .input-group { position: relative; }
        .eye-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 20px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
        <div class="fade-in bg-white p-12 rounded-[2.5rem] shadow-2xl border border-slate-100 w-full max-w-md text-center">
            <div class="mb-8">
                <div class="w-20 h-20 bg-black rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-white text-3xl font-black">AT</span>
                </div>
                <h2 class="text-2xl font-black uppercase tracking-tight text-black">Pintu Masuk</h2>
                <p class="text-black text-[10px] font-bold uppercase tracking-widest mt-1">Admin Penulis Pemula</p>
            </div>
            
            <div class="input-group mb-4">
                <input type="password" id="login_pass" placeholder="Password Rahasia" class="w-full p-4 bg-slate-50 border border-black rounded-2xl focus:ring-2 focus:ring-black outline-none transition text-center text-lg text-black">
                <span class="eye-btn" onclick="togglePassword()">👁️</span>
            </div>

            <button onclick="prosesLogin()" class="w-full bg-black text-white p-4 rounded-2xl font-black uppercase tracking-widest hover:bg-slate-800 transition active:scale-95 shadow-xl mb-6 text-sm">Buka Kunci</button>
            <a href="index.html" class="block text-black text-[10px] font-black uppercase tracking-[0.3em] hover:underline decoration-2 underline-offset-4">← Kembali ke Blog</a>
        </div>
    </div>

    <div id="admin-panel">
        <nav class="bg-black text-white shadow-lg sticky top-0 z-50">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center text-xs font-black uppercase tracking-widest">
                <h1>Admin Dashboard</h1>
                <button onclick="logout()" class="border border-white px-4 py-1.5 rounded-full hover:bg-white hover:text-black transition">Keluar</button>
            </div>
        </nav>

        <main class="container mx-auto px-4 py-10 max-w-3xl text-black">
            <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border border-slate-100 mb-10">
                <form id="blogForm" class="space-y-6">
                    <h2 class="text-2xl font-black border-b-4 border-black inline-block uppercase tracking-tight mb-4 text-black">Posting Baru</h2>
                    <input type="text" id="judul" required placeholder="Judul Artikel" class="w-full p-4 border border-black rounded-xl font-bold text-black">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="date" id="tanggal" required class="p-4 border border-black rounded-xl text-black">
                        <select id="kategori" class="p-4 border border-black rounded-xl font-black text-black">
                            <option value="Rasan-rasan">Rasan-rasan</option>
                            <option value="Fiksiana">Fiksiana</option>
                            <option value="Asal nulis">Asal Nulis</option>
                        </select>
                    </div>
                    <textarea id="konten" rows="10" required placeholder="Tulis rasan-rasan Bapak..." class="w-full p-6 border border-black rounded-xl text-black"></textarea>
                    <button type="submit" id="submitBtn" class="w-full bg-black text-white p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-slate-800 transition">Kirim ke Blog</button>
                </form>
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] shadow-lg border border-slate-100">
                <h3 class="text-[10px] font-black uppercase mb-6 border-b pb-2 text-black">Edit di Spreadsheet</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <tbody id="list-postingan"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Masukkan URL Spreadsheet Bapak di sini
        const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1XfK5k0_7w8_8_G7Wz_I_I0_7w8_8_G7Wz/edit";
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec";

        // Fitur Intip Password
        function togglePassword() {
            const passInput = document.getElementById('login_pass');
            const eyeBtn = document.querySelector('.eye-btn');
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeBtn.innerText = "🙈"; // Tutup mata
            } else {
                passInput.type = "password";
                eyeBtn.innerText = "👁️"; // Buka mata
            }
        }

        function prosesLogin() {
            const pass = document.getElementById('login_pass').value;
            if (pass === "") return alert("Isi password!");
            sessionStorage.setItem("adminPass", pass);
            bukaPanelAdmin();
        }

        function bukaPanelAdmin() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            sessionStorage.setItem("adminAuth", "true");
            fetchData();
        }

        async function fetchData() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const container = document.getElementById('list-postingan');
            container.innerHTML = '';
            data.forEach((post, index) => {
                const rowNum = index + 2; 
                container.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 transition">
                        <td class="py-4 px-2 font-bold text-xs text-black">${post.judul}</td>
                        <td class="py-4 px-2 text-right">
                            <button onclick="bukaSheet(${rowNum})" class="bg-blue-600 text-white px-4 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest">Edit Baris ${rowNum}</button>
                        </td>
                    </tr>`;
            });
        }

        function bukaSheet(row) {
            const rangeUrl = SPREADSHEET_URL + "?range=A" + row;
            window.open(rangeUrl, '_blank');
        }

        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "MENGIRIM...";
            
            const payload = {
                password: sessionStorage.getItem("adminPass"),
                judul: document.getElementById('judul').value,
                tanggal: document.getElementById('tanggal').value,
                konten: document.getElementById('konten').value,
                kategori: document.getElementById('kategori').value
            };

            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.text();
            
            if (result === "PASSWORD_SALAH") {
                alert("Gagal! Password Salah.");
                logout();
            } else {
                alert("Berhasil Terposting!");
                location.reload();
            }
        });

        function logout() { sessionStorage.clear(); location.reload(); }
        if (sessionStorage.getItem("adminAuth") === "true") bukaPanelAdmin();
    </script>
</body>
</html>
