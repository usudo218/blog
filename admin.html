<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel Blog Pak Cokro</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    CMS.init({
      config: {
        // Ganti 'username/repo-anda' dengan nama akun GitHub dan nama repo Anda
        backend: {
          name: 'github',
          repo: 'username/nama-repo-anda', 
          branch: 'main',
        },
        media_folder: 'images', // Folder untuk menyimpan gambar jika Anda upload
        public_folder: '/images',
        collections: [
          {
            name: 'blog',
            label: 'Postingan Blog',
            folder: '_posts', // Artikel akan disimpan di folder ini sebagai file Markdown/MD
            create: true,
            slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
            fields: [
              { label: 'Judul Artikel', name: 'title', widget: 'string' },
              { label: 'Tanggal Publish', name: 'date', widget: 'datetime' },
              { label: 'Ringkasan (untuk Read More)', name: 'description', widget: 'text' },
              { label: 'Isi Konten (Bisa Copas dari Word)', name: 'body', widget: 'markdown' },
            ],
          },
        ],
      },
    });
  </script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
