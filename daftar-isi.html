<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Isi | Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-black text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold tracking-tight ">PENULIS PEMULA</h1>
            <div class="flex space-x-4 text-xs font-bold tracking-widest">
                <a href="index.html" class="hover:text-slate-300 transition">Blog</a>
                <a href="daftar-isi.html" class="border-b-2 border-white pb-1">Daftar Isi</a>
                <a href="about.html" class="hover:text-slate-300 transition">About</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="fade-in">
            <h2 class="text-3xl font-black mb-8 border-b-4 border-black inline-block tracking-tight">Coretan saya</h2>
            
            <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="p-4 md:p-6 text-sm font-bold  tracking-wider text-slate-500">Judul Catatan</th>
                            <th class="p-4 md:p-6 text-sm font-bold  tracking-wider text-slate-500 hidden md:table-cell">Kategori</th>
                        </tr>
                    </thead>
                    <tbody id="daftar-isi-container">
                        <tr>
                            <td colspan="2" class="p-10 text-center animate-pulse text-slate-400 italic">Membuka arsip...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec"; // <--- Pastikan URL-nya sama dengan yang di script.js

        async function ambilDaftarIsi() {
            const container = document.getElementById('daftar-isi-container');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Urutkan dari yang terbaru (reverse)
                const dataUrut = data.reverse();
                
                container.innerHTML = '';
                dataUrut.forEach((post, index) => {
                    // Logika Kategori
                    const kat = (post.kategori || post.Kategori || "UMUM").toUpperCase();
                    
                    container.innerHTML += `
                        <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                            <td class="p-4 md:p-6">
                                <a href="index.html?id=${index}" class="text-base md:text-lg font-bold text-slate-900 hover:text-black hover:underline leading-tight">
                                    ${post.judul}
                                </a>
                                <div class="text-[10px] text-slate-400 mt-1 uppercase font-medium md:hidden">
                                    ${kat} | ${post.tanggal}
                                </div>
                            </td>
                            <td class="p-4 md:p-6 hidden md:table-cell">
                                <span class="text-[10px] font-black px-2 py-1 bg-slate-100 text-slate-600 rounded-md uppercase tracking-widest border border-slate-200">
                                    ${kat}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<tr><td colspan="2" class="p-10 text-center text-red-500">Gagal memuat arsip.</td></tr>';
            }
        }

        window.onload = ambilDaftarIsi;
    </script>
</body>
</html>
