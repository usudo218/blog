<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Catatan | Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            color: #000000; /* Warna dasar hitam untuk seluruh body */
        }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Judul Link: Hitam pekat, Biru saat disorot */
        .judul-link { 
            color: #000000; 
            font-size: 0.95rem; 
            font-weight: 600;
            transition: color 0.2s;
            text-decoration: none;
        }
        .table-row:hover .judul-link { 
            color: #2563eb; 
        }
        
        /* Nomor urut & Tanggal: Semuanya Hitam */
        .num-col { 
            color: #000000; 
            font-weight: 600; 
            font-size: 0.95rem;
            font-style: italic;
            opacity: 0.8; /* Sedikit soft tapi tetap hitam */
        }

        .text-date {
            font-size: 0.75rem;
            color: #000000;
            font-weight: 500;
            opacity: 0.7;
        }

        /* Footer Hitam Pekat */
        .footer-text {
            color: #000000;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Mengurangi tinggi baris agar lebih rapat */
        .table-row td {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="bg-black text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-extrabold tracking-tight">PENULIS PEMULA</h1>
            <div class="flex space-x-6 text-[11px] font-bold uppercase tracking-widest">
                <a href="index.html" class="hover:text-slate-300 transition">Blog</a>
                <a href="daftar-isi.html" class="border-b-2 border-white pb-1">Daftar Isi</a>
                <a href="about.html" class="hover:text-slate-300 transition">About</a>
                <a href="admin.html" class="hover:text-slate-300 transition">Login</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="fade-in">
            <div class="mb-8 text-center md:text-left">
                <h2 class="text-2xl font-extrabold text-slate-900 uppercase tracking-tight border-b-4 border-black inline-block">Arsip Catatan</h2>
                <p class="text-black mt-2 text-sm italic font-medium">Kumpulan rasan-rasan dari asal nulisnya Penulis Pemula.</p>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-[10px] uppercase tracking-[0.2em] text-black font-black">
                            <th class="p-4 text-center w-16">No.</th>
                            <th class="p-4">Judul & Tanggal</th>
                            <th class="p-4 hidden md:table-cell text-right text-xs">Kategori</th>
                        </tr>
                    </thead>
                    <tbody id="daftar-isi-container">
                        <tr>
                            <td colspan="3" class="p-20 text-center text-black font-bold text-xs uppercase tracking-widest italic animate-pulse">
                                Membuka laci arsip...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p class="text-center mt-12 footer-text">
                &copy; 2026 Penulis Pemula - Merawat Ingatan
            </p>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec";

        async function ambilDaftarIsi() {
            const container = document.getElementById('daftar-isi-container');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const dataUrut = data.reverse();
                
                container.innerHTML = '';
                dataUrut.forEach((post, index) => {
                    const kat = (post.kategori || post.Kategori || "UMUM").toUpperCase();
                    
                    let tgl = post.tanggal || "";
                    if (tgl.toString().includes("T") || tgl.toString().includes("-")) {
                        const d = new Date(tgl);
                        tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    }
                    
                    container.innerHTML += `
                        <tr class="table-row border-b border-slate-50 transition duration-200">
                            <td class="px-4 py-3 text-center num-col">
                                ${String(index + 1).padStart(2, '0')}
                            </td>
                            <td class="px-4 py-3">
                                <a href="index.html?id=${index}" class="judul-link block leading-tight">
                                    ${post.judul}
                                </a>
                                <div class="text-date mt-0.5 uppercase tracking-wider">
                                    <span>${tgl}</span>
                                    <span class="mx-2 md:hidden">•</span>
                                    <span class="md:hidden text-black font-black">${kat}</span>
                                </div>
                            </td>
                            <td class="px-4 py-3 hidden md:table-cell text-right">
                                <span class="inline-block text-[9px] font-black px-2 py-0.5 bg-slate-100 text-black border border-slate-200 rounded uppercase tracking-tighter">
                                    ${kat}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<tr><td colspan="3" class="p-20 text-center text-xs text-black uppercase font-bold tracking-widest">Gagal memuat arsip.</td></tr>';
            }
        }

        window.onload = ambilDaftarIsi;
    </script>
</body>
</html>
