<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Catatan | Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Table Styling */
        .table-row:hover .judul-link { color: #000; text-decoration: underline; }
        .num-col { font-family: serif; font-style: italic; color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-black text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold tracking-tight ">PENULIS PEMULA</h1>
            <div class="flex space-x-6 text-xs font-bold tracking-widest">
                <a href="index.html" class="hover:text-slate-300 transition">Blog</a>
                <a href="daftar-isi.html" class="border-b-2 border-white pb-1">Daftar Isi</a>
                <a href="about.html" class="hover:text-slate-300 transition">About</a>
                <a href="admin.html" class="hover:text-slate-300 transition">Login</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="fade-in">
            <div class="mb-12 text-center md:text-left">
                <h2 class="text-4xl font-black text-slate-900 uppercase tracking-tighter border-b-8 border-black inline-block">Arsip Catatan</h2>
                <p class="text-slate-500 mt-4 font-medium italic">Kumpulan rasan-rasan dari asal nulisnya Penulis Pemula.</p>
            </div>
            
            <div class="bg-white rounded-[2rem] shadow-2xl border border-slate-100 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-[10px] tracking-[0.2em] text-slate-400">
                            <th class="p-6 text-center w-16">No.</th>
                            <th class="p-6">Judul & Tanggal</th>
                            <th class="p-6 hidden md:table-cell">Kategori</th>
                        </tr>
                    </thead>
                    <tbody id="daftar-isi-container">
                        <tr>
                            <td colspan="3" class="p-20 text-center">
                                <div class="animate-pulse flex flex-col items-center">
                                    <div class="h-4 w-48 bg-slate-200 rounded mb-4"></div>
                                    <p class="text-slate-400 italic text-sm">Membuka laci arsip...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p class="text-center mt-12 text-slate-400 text-xs font-bold tracking-widest">
                &copy; 2026 Penulis Pemula - Merawat Ingatan
            </p>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec"; // <--- Masukkan URL Apps Script Bapak di sini

        async function ambilDaftarIsi() {
            const container = document.getElementById('daftar-isi-container');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Urutkan artikel terbaru di paling atas
                const dataUrut = data.reverse();
                
                container.innerHTML = '';
                dataUrut.forEach((post, index) => {
                    // Logika Kategori
                    const kat = (post.kategori || post.Kategori || "UMUM").toUpperCase();
                    
                    // Perbaikan Format Tanggal agar tidak muncul 000Z
                    let tgl = post.tanggal || "";
                    if (tgl.toString().includes("T") || tgl.toString().includes("-")) {
                        const d = new Date(tgl);
                        tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    }
                    
                    container.innerHTML += `
                        <tr class="table-row border-b border-slate-50 hover:bg-slate-50/50 transition duration-300">
                            <td class="p-6 text-center num-col text-lg">
                                ${String(index + 1).padStart(2, '0')}
                            </td>
                            <td class="p-6">
                                <a href="index.html?id=${index}" class="judul-link block text-lg font-black text-slate-800 leading-tight transition-colors">
                                    ${post.judul}
                                </a>
                                <div class="flex items-center mt-2 text-[11px] font-bold text-slate-400 uppercase tracking-widest">
                                    <span>${tgl}</span>
                                    <span class="mx-2 md:hidden">•</span>
                                    <span class="md:hidden text-black">${kat}</span>
                                </div>
                            </td>
                            <td class="p-6 hidden md:table-cell">
                                <span class="inline-block text-[9px] font-black px-3 py-1 bg-black text-white rounded-full tracking-tighter">
                                    ${kat}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<tr><td colspan="3" class="p-20 text-center text-red-500 font-bold">Gagal memuat arsip. Silakan cek koneksi internet Bapak.</td></tr>';
            }
        }

        window.onload = ambilDaftarIsi;
    </script>
</body>
</html>
