<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Catatan | Penulis Pemula</title>
    
    <meta name="description" content="Arsip catatan dan rasan-rasan dari Penulis Pemula.">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/usudo218/blog/main/pp.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            color: #000000; 
        }
        
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* List Style seperti Gambar */
        .arsip-list {
            list-style-type: square;
            padding-left: 1.5rem;
        }

        .arsip-item {
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .judul-link { 
            color: #2563eb; 
            font-size: 1rem; 
            font-weight: 500;
            transition: color 0.2s;
            text-decoration: none;
        }
        
        .judul-link:hover { 
            text-decoration: underline;
            color: #1d4ed8; 
        }

        .footer-text {
            color: #64748b;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-white">

    <nav class="bg-black text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black tracking-tight ">PENULIS PEMULA</h1>
            <div class="flex space-x-6 text-xs font-bold tracking-widest uppercase">
                <a href="index.html" class="hover:text-slate-300 transition">Blog</a>
                <a href="daftar-isi.html" class="border-b-2 border-white pb-1">Daftar Isi</a>
                <a href="about.html" class="hover:text-slate-300 transition">About</a>
                <a href="admin.html" class="hover:text-slate-300 transition">Login</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="fade-in">
            <div class="mb-10">
                <h2 class="text-3xl font-bold text-slate-900 leading-tight mb-2">Arsip Catatan</h2>
                <p class="text-slate-600 text-lg font-medium">Kumpulan rasan-rasan dari asal nulisnya Penulis Pemula.</p>
            </div>
            
            <div class="border-t border-slate-100 pt-8">
                <ul id="daftar-isi-container" class="arsip-list">
                    <li class="text-slate-400 italic animate-pulse">Membuka laci arsip...</li>
                </ul>
            </div>

            <footer class="mt-20 pb-8 border-t border-slate-50 pt-10">
                <p class="text-center footer-text">
                    &copy; 2026 Penulis Pemula - Merawat Ingatan
                </p>
            </footer>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxtNsPf6THGZWi3VBJS06c9zgAu2otLLjafqXPQ2z8hZWol5T5hUTcFtXAOC6CEq0PtWA/exec";

        async function ambilDaftarIsi() {
            const container = document.getElementById('daftar-isi-container');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // Tambahkan index asli agar link id tetap benar
                const dataDenganID = data.map((item, index) => {
                    return { ...item, indexAsli: index };
                });

                // Urutkan terbaru di atas
                const dataUrut = dataDenganID.reverse();
                
                container.innerHTML = '';
                dataUrut.forEach((post) => {
                    container.innerHTML += `
                        <li class="arsip-item">
                            <a href="index.html?id=${post.indexAsli}" class="judul-link">
                                ${post.judul}
                            </a>
                        </li>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<li class="text-red-500 font-bold">Gagal memuat arsip. Silakan cek koneksi atau API URL.</li>';
            }
        }

        window.onload = ambilDaftarIsi;
    </script>
</body>
</html>
