<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Cokro Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi halus untuk Modal */
        #article-modal { transition: opacity 0.3s ease; }
        .modal-content { animation: slideUp 0.4s ease; }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <nav class="bg-blue-600 text-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Penuis Pemula</h1>
            <div class="space-x-6 hidden md:flex">
                <a href="index.html" class="hover:text-blue-200 transition">Blog</a>
                <a href="daftar-isi.html" class="hover:text-blue-200 transition">Daftar Isi</a>
                <a href="about.html" class="hover:text-blue-200 transition">About Me</a>
            </div>
        </div>
    </nav>

    <header class="container mx-auto px-6 mt-10">
        <h2 class="text-4xl font-extrabold text-gray-800 mb-2">Artikel Terbaru</h2>
        <p class="text-gray-500">Berbagi seputar teknologi, pendidikan, dan catatan harian.</p>
        <hr class="mt-6 border-gray-200">
    </header>

    <main class="container mx-auto px-6 py-10">
        <div id="blog-container" class="grid gap-8 max-w-4xl">
            <div class="text-center py-10">
                <p class="text-gray-500 animate-pulse">Memuat artikel dari Spreadsheet...</p>
            </div>
        </div>
    </main>

    <div id="article-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm">
        <div class="modal-content bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] overflow-hidden shadow-2xl flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800 pr-4 line-clamp-1">Judul Artikel</h3>
                <button onclick="tutupArtikel()" class="text-gray-400 hover:text-red-500 transition text-3xl">&times;</button>
            </div>
            <div class="p-8 overflow-y-auto italic-text-fix">
                <p id="modal-date" class="text-sm text-blue-600 mb-4 font-semibold uppercase tracking-wider"></p>
                <div id="modal-body" class="text-gray-700 leading-relaxed text-lg space-y-4">
                    </div>
            </div>
            <div class="p-4 border-t bg-gray-50 text-right">
                <button onclick="tutupArtikel()" class="bg-gray-800 text-white px-6 py-2 rounded-lg hover:bg-gray-700 transition">Tutup</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
