<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penulis Pemula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi halus saat berganti halaman */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Pengaturan Tipografi untuk HP */
        #content-body { 
            line-height: 1.8; 
            font-size: 1.1rem; 
        }
        #content-body p { margin-bottom: 1.5rem; }
        
        /* Menghilangkan scroll horizontal jika ada gambar lebar */
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 leading-normal">

    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold tracking-tight">Penulis Pemula</h1>
            <div class="flex space-x-3 md:space-x-6 text-sm md:text-base font-medium">
                <a href="index.html" class="hover:text-blue-100 transition border-b-2 border-white pb-1">Blog</a>
                <a href="daftar-isi.html" class="hover:text-blue-100 transition">Daftar Isi</a>
                <a href="about.html" class="hover:text-blue-100 transition">About</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6 md:py-10 max-w-4xl">
        
        <div id="view-list" class="fade-in">
            <header class="mb-8 md:mb-12 text-left md:text-center">
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2">Artikel Terbaru</h2>
                <p class="text-base md:text-lg text-slate-600">Catatan Harian Penulis Pemula</p>
                <div class="mt-6 border-b border-slate-200"></div>
            </header>

            <div id="blog-container" class="grid gap-6 md:gap-8">
                <div class="text-center py-12 bg-white rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 animate-pulse">Menghubungkan ke database...</p>
                </div>
            </div>
        </div>

        <div id="view-detail" class="hidden fade-in bg-white p-5 md:p-10 rounded-2xl md:rounded-3xl shadow-lg border border-slate-100">
            <button onclick="kembaliKeDaftar()" class="mb-6 flex items-center text-blue-600 font-bold py-2 hover:text-blue-800 transition group">
                <svg class="w-5 h-5 mr-2 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali
            </button>

            <article>
                <header class="mb-6 md:mb-10 pb-4 border-b border-slate-100 text-left">
                    <h1 id="content-title" class="text-2xl md:text-4xl font-extrabold text-slate-950 leading-tight">Judul Artikel</h1>
                    <p id="content-date" class="text-blue-600 text-xs md:text-sm font-semibold mt-3 uppercase tracking-widest"></p>
                </header>
                
                <div id="content-body" class="text-slate-800 break-words overflow-hidden">
                    </div>
            </article>

            <div class="mt-12 pt-8 border-t border-slate-100 text-center text-slate-400 text-sm">
                <p>&copy; 2026 Penulis Pemula. All rights reserved</p>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
