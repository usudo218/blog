<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penulis Pemula | Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Tipografi Artikel Standar Profesional */
        #content-body { 
            line-height: 1.7; 
            font-size: 1rem; 
            color: #334155; 
        }
        #content-body p { margin-bottom: 1.25rem; }
        
        #content-body blockquote {
            margin: 1.5rem 0;
            padding: 1rem 1.5rem;
            border-left: 4px solid #1a1a1a; 
            background-color: #f8fafc;
            font-style: italic;
            color: #475569;
            font-size: 0.95rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        #content-body img { 
            max-width: 100%; height: auto; border-radius: 0.75rem; 
            margin: 1.5rem 0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
        }

        /* Footer Hitam Pekat */
        .footer-text {
            color: #000000;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Skeleton Loading */
        .skeleton { background: #e2e8f0; border-radius: 1rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-black text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-extrabold tracking-tight">PENULIS PEMULA</h1>
            <div class="flex space-x-4 text-[11px] font-bold uppercase tracking-widest">
                <a href="index.html" class="border-b-2 border-white pb-1">Blog</a>
                <a href="daftar-isi.html">Daftar Isi</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2">
                <div id="view-list" class="fade-in">
                    <h2 id="section-title" class="text-xl font-extrabold mb-6 border-b-2 border-black inline-block text-slate-800 uppercase tracking-tight">Catatan Terbaru</h2>
                    <div id="blog-container" class="space-y-6">
                        <div class="skeleton h-40 w-full"></div>
                        <div class="skeleton h-40 w-full"></div>
                    </div>
                </div>

                <div id="view-detail" class="hidden fade-in bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-100">
                    <button onclick="kembaliKeDaftar()" class="mb-6 text-sm font-bold text-black hover:underline">← Kembali</button>
                    <article>
                        <header class="mb-6 border-b pb-4">
                            <h1 id="content-title" class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-tight"></h1>
                            <p id="content-date" class="text-black text-[11px] font-bold mt-2 uppercase tracking-widest"></p>
                        </header>
                        <div id="content-body"></div>
                    </article>
                </div>
            </div>

            <aside class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <img src="https://raw.githubusercontent.com/usudo218/blog/main/pp.png" class="w-20 h-20 rounded-full mx-auto mb-3 border-2 border-slate-100 shadow-sm">
                    <h4 class="font-bold text-sm text-slate-900">Agus Tjakra</h4>
                    <p class="text-black text-xs italic font-medium mt-1">"Menulis untuk merawat ingatan"</p>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h4 class="text-[10px] font-bold uppercase tracking-widest text-black mb-4">Topik Utama</h4>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="filterKategori('Semua')" class="bg-black text-white px-3 py-1 rounded-full text-[10px] font-bold">Semua</button>
                        <button onclick="filterKategori('Rasan-rasan')" class="bg-slate-100 text-black px-3 py-1 rounded-full text-[10px] font-bold hover:bg-black hover:text-white transition">Rasan-rasan</button>
                        <button onclick="filterKategori('Fiksiana')" class="bg-slate-100 text-black px-3 py-1 rounded-full text-[10px] font-bold hover:bg-black hover:text-white transition">Fiksiana</button>
                    </div>
                </div>
            </aside>
        </div>

        <footer class="mt-20 pb-10">
            <p class="text-center footer-text">
                &copy; 2026 Penulis Pemula - Merawat Ingatan
            </p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
