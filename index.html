<div class="mt-16 border-t-4 border-black pt-10">
    <div class="flex justify-between items-center mb-8">
        <h4 class="text-xs font-black uppercase tracking-widest text-slate-400">Jejak Pembaca :</h4>
        <button onclick="toggleCommentForm()" id="btn-tulis" class="bg-black text-white text-[10px] font-black px-6 py-2 rounded-full hover:scale-105 transition uppercase tracking-widest shadow-lg">
            Tulis Rasan-rasan
        </button>
    </div>

    <div id="wrapper-form-komen" class="hidden mb-10 p-6 bg-slate-100 rounded-[2rem] border-2 border-dashed border-slate-300 fade-in">
        <div id="cusdis_thread"
            data-host="https://cusdis.com"
            data-app-id="f85158e4-21d5-4759-94e5-77a9647fa4c5"
            data-page-id="" 
            data-page-url=""
            data-page-title="">
        </div>
    </div>

    <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
</div>

<script>
    // Fungsi untuk Buka-Tutup Form Komentar
    function toggleCommentForm() {
        const wrapper = document.getElementById('wrapper-form-komen');
        const btn = document.getElementById('btn-tulis');
        
        if (wrapper.classList.contains('hidden')) {
            wrapper.classList.remove('hidden');
            btn.innerText = 'Tutup Form';
            btn.classList.replace('bg-black', 'bg-red-500');
            // Scroll otomatis ke form agar pengguna tahu form sudah buka
            wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            wrapper.classList.add('hidden');
            btn.innerText = 'Tulis Rasan-rasan';
            btn.classList.replace('bg-red-500', 'bg-black');
        }
    }
</script>
