<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penulis Pemula Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi halus saat berganti halaman */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* Mengatur spasi paragraf dari Word */
        #content-body p { margin-bottom: 1.2rem; line-height: 1.8; }
        #content-body { font-size: 1.125rem; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Peulis Pemula</h1>
            <div class="space-x-6 hidden md:flex">
                <a href="index.html" class="hover:text-blue-100 transition">Blog</a>
                <a href="daftar-isi.html" class="hover:text-blue-100 transition">Daftar Isi</a>
                <a href="about.html" class="hover:text-blue-100 transition">About Me</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-10 max-w-5xl">
        
        <div id="view-list" class="fade-in">
            <header class="mb-12 text-center">
                <h2 class="text-4xl font-extrabold text-slate-900 mb-2">Artikel Terbaru</h2>
                <p class="text-lg text-slate-600 max-w-2xl mx-auto">Selamat datang di catatan pribadi saya. Silakan jelajahi berbagai topik menarik di bawah ini.</p>
                <div class="mt-8 border-b border-slate-200"></div>
            </header>

            <div id="blog-container" class="grid gap-8">
                <div class="text-center py-16 bg-white rounded-xl shadow border border-slate-100">
                    <p class="text-slate-500 animate-pulse text-lg">Menghubungkan ke Spreadsheet...</p>
                </div>
            </div>
        </div>

        <div id="view-detail" class="hidden fade-in bg-white p-10 rounded-3xl shadow-lg border border-slate-100">
            <button onclick="kembaliKeDaftar()" class="mb-8 flex items-center text-blue-600 font-semibold hover:text-blue-800 transition group">
                <svg class="w-5 h-5 mr-2 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Daftar Artikel
            </button>

            <article>
                <header class="mb-10 pb-6 border-b border-slate-100">
                    <h1 id="content-title" class="text-4xl md:text-5xl font-extrabold text-slate-950 leading-tight">Judul Panjang Artikel</h1>
                    <p id="content-date" class="text-blue-600 text-base font-semibold mt-4 uppercase tracking-widest"></p>
                </header>
                
                <div id="content-body" class="text-slate-800 leading-relaxed space-y-2">
                    </div>
            </article>

            <div class="mt-12 pt-8 border-t border-slate-100 text-center text-slate-500">
                <p>&copy; 2024 Penulis Pemula. All rights reserved.</p>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
